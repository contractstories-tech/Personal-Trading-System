# Cost schedule - equity delivery, NSE. Effective-dated. Document 04 s4.
# status: verified = confirmed from current sources at drafting (21 Sep 2026)
#         confirm_contract_note = plausible, must be confirmed against a real contract note at Stage 0
#         historical_estimate = pre-period approximation; small effect; verify at Stage 0
schedule_version: 1.0.0
rounding: "each component rounded to the paisa; GST base uses rounded components"
components:
  stt:
    - {from: 2008-06-01, to: 2013-05-31, buy: 0.00125, sell: 0.00125, status: historical_estimate}
    - {from: 2013-06-01, to: null,       buy: 0.0010,  sell: 0.0010,  status: verified,
       note: "Budget 2026 raised derivatives STT only (from 1 Apr 2026); delivery unchanged"}
  stamp_duty:
    - {from: 2008-06-01, to: 2020-06-30, buy: 0.00015, sell: 0.0, status: historical_estimate,
       note: "state-specific before 1 Jul 2020; uniform rate used as approximation"}
    - {from: 2020-07-01, to: null, buy: 0.00015, sell: 0.0, status: confirm_contract_note,
       note: "collected by clearing corporations on the buy side under the Stamp Act amendment effective 1 Jul 2020"}
  exchange_txn_nse:
    - {from: 2008-06-01, to: 2024-09-30, rate: 0.0000322, status: historical_estimate}
    - {from: 2024-10-01, to: null,       rate: 0.0000297, status: confirm_contract_note,
       note: "sources cite 0.00297%-0.00325%; confirm current rate"}
  sebi_turnover_fee:
    - {from: 2008-06-01, to: null, rate: 0.000001, status: verified, note: "Rs 10 per crore"}
  gst:
    - {from: 2017-07-01, to: null, rate: 0.18, base: [brokerage, exchange_txn_nse, sebi_turnover_fee], status: verified}
    - {from: 2008-06-01, to: 2017-06-30, rate: 0.15, base: [brokerage, exchange_txn_nse, sebi_turnover_fee], status: historical_estimate,
       note: "service tax before GST"}
broker_profiles:
  flat_20:        {brokerage_per_order: 20.0, dp_charge_per_sell_scrip_day: 13.5, note: "conservative default"}
  zero_delivery:  {brokerage_per_order: 0.0,  dp_charge_per_sell_scrip_day: 13.5}
default_profile: flat_20
stress_multipliers: {base: 1.0, stress: 2.0}

# Golden cases - Document 04 s2. Synthetic inputs; answers computed BY HAND before the
# reference was run. Any production engine must reproduce every expected value.
fills:
  - {id: G01, doc: "buy limit fills at an open below the limit", limit: 105, open: 102, upper_band: 110, expect: 102}
  - {id: G02, doc: "open above the limit: no fill", limit: 105, open: 106, upper_band: 110, expect: null}
  - {id: G03, doc: "open AT the upper band: no fill even though open <= limit (open tested against the band, not the close state)",
     limit: 105, open: 104.5, upper_band: 104.5, expect: null}
sells:
  - {id: G04, doc: "normal market-on-open exit", sessions: [{open: 98, lower_band: 90}], expect: [98, 0]}
  - {id: G05, doc: "open locked at lower band, fills next session with one-session haircut",
     sessions: [{open: 90, lower_band: 90}, {open: 86, lower_band: 81}], expect: [85.14, 1]}
  - {id: G06, doc: "band file missing: 2% haircut, since band data is most likely missing when a stock was locked", sessions: [{open: 97, lower_band: null}], expect: [95.06, 0]}
  - {id: G06b, doc: "seven locked sessions: haircut capped at 5%",
     sessions: [{open: 60, lower_band: 60}, {open: 57, lower_band: 57}, {open: 54, lower_band: 54}, {open: 52, lower_band: 52},
                {open: 51, lower_band: 51}, {open: 50.5, lower_band: 50.5}, {open: 50, lower_band: 50}, {open: 50, lower_band: 47}],
     expect: [47.5, 7]}
impact:
  - {id: G07a, doc: "Rs 0.5 cr into Rs 25 cr ADV fails S1 (0.35%)", value_cr: 0.5, adv_cr: 25, expect: 0.0038284, s1_passes: false}
  - {id: G07b, doc: "Rs 0.5 cr into Rs 100 cr ADV passes S1", value_cr: 0.5, adv_cr: 100, expect: 0.0019142, s1_passes: true}
costs:
  - {id: G08a, doc: "buy Rs 1,00,000, current schedule, flat_20", side: buy, value: 100000, date: 2026-09-21,
     expect: {brokerage: 20.0, stt: 100.0, stamp_duty: 15.0, exchange_txn_nse: 2.97, sebi_turnover_fee: 0.1, gst: 4.15, total: 142.22}}
  - {id: G08b, doc: "sell Rs 1,10,000, current schedule, flat_20", side: sell, value: 110000, date: 2026-09-21,
     expect: {brokerage: 20.0, stt: 110.0, stamp_duty: 0.0, exchange_txn_nse: 3.27, sebi_turnover_fee: 0.11, gst: 4.21, dp_charge: 15.93, total: 153.52}}
  - {id: G08c, doc: "buy Rs 1,00,000 in 2012: historical STT and service tax", side: buy, value: 100000, date: 2012-01-02,
     expect: {brokerage: 20.0, stt: 125.0, stamp_duty: 15.0, exchange_txn_nse: 3.22, sebi_turnover_fee: 0.1, gst: 3.5, total: 166.82}}
tax:
  - {id: G09a, doc: "short-term loss offsets long-term gain; within exemption", fy: 2026,
     disposals: [{buy_date: 2025-06-02, sell_date: 2026-07-01, qty: 100, cost_per_share: 1000, sale_per_share: 1500},
                 {buy_date: 2026-04-10, sell_date: 2026-08-01, qty: 200, cost_per_share: 500, sale_per_share: 450}],
     expect: {stcg: 0.0, ltcg: 40000.0, taxable_ltcg: 0.0, tax_before_cess: 0.0, tax_with_cess: 0.0}}
  - {id: G09b, doc: "current regime: 20% STCG, 12.5% LTCG above Rs 1.25 lakh", fy: 2026,
     disposals: [{buy_date: 2024-01-01, sell_date: 2026-06-01, qty: 1000, cost_per_share: 100, sale_per_share: 400},
                 {buy_date: 2026-05-01, sell_date: 2026-09-01, qty: 500, cost_per_share: 200, sale_per_share: 300}],
     expect: {stcg: 50000.0, ltcg: 300000.0, taxable_ltcg: 175000.0, tax_before_cess: 31875.0, tax_with_cess: 33150.0}}
  - {id: G09c, doc: "2018-2024 regime: 15% STCG, 10% LTCG above Rs 1 lakh", fy: 2023,
     disposals: [{buy_date: 2023-01-10, sell_date: 2023-05-01, qty: 100, cost_per_share: 100, sale_per_share: 200},
                 {buy_date: 2021-01-01, sell_date: 2023-06-01, qty: 1000, cost_per_share: 100, sale_per_share: 250}],
     expect: {stcg: 10000.0, ltcg: 150000.0, taxable_ltcg: 50000.0, tax_before_cess: 6500.0, tax_with_cess: 6760.0}}
  - {id: G09d, doc: "pre-2018: LTCG exempt, STCG 15%", fy: 2017,
     disposals: [{buy_date: 2015-01-01, sell_date: 2017-06-01, qty: 100, cost_per_share: 100, sale_per_share: 300},
                 {buy_date: 2017-02-01, sell_date: 2017-06-01, qty: 100, cost_per_share: 100, sale_per_share: 150}],
     expect: {stcg: 5000.0, ltcg: 20000.0, taxable_ltcg: 0.0, tax_before_cess: 750.0, tax_with_cess: 780.0}}
  - {id: G09e, doc: "grandfathered cost: max(actual, min(FMV 31 Jan 2018, sale))", fy: 2019,
     disposals: [{buy_date: 2016-03-01, sell_date: 2019-05-01, qty: 100, cost_per_share: 100, sale_per_share: 200, fmv_2018: 150}],
     expect: {stcg: 0.0, ltcg: 5000.0, taxable_ltcg: 0.0, tax_before_cess: 0.0, tax_with_cess: 0.0}}
holding_period:
  - {id: G09f, doc: "exactly 12 months is still short-term", buy: 2025-06-02, sell: 2026-06-02, expect: false}
  - {id: G09g, doc: "12 months and a day is long-term", buy: 2025-06-02, sell: 2026-06-03, expect: true}
stop:
  - {id: G10, doc: "sessions start at the FILL session; tie does not update; post-peak calm cannot lift the stop; exit on session 6",
     entry_fill: 100, atr_at_entry: 0.04,
     sessions: [{close: 100, atr_pct: 0.04}, {close: 105, atr_pct: 0.04}, {close: 110, atr_pct: 0.03}, {close: 110, atr_pct: 0.02},
                {close: 106, atr_pct: 0.015}, {close: 105, atr_pct: 0.015}, {close: 101, atr_pct: 0.015}],
     expect: {stops_tested: [90.0, 90.0, 94.5, 101.75, 101.75, 101.75, 101.75], exit_session: 6}}
  - {id: G10b, doc: "a fill-day close below the initial stop exits on the fill day itself",
     entry_fill: 100, atr_at_entry: 0.04, sessions: [{close: 88, atr_pct: 0.04}],
     expect: {stops_tested: [90.0], exit_session: 0}}
corporate_actions:
  - {id: G11a, kind: split_bonus, doc: "1:1 bonus mid-position: quantity doubles, every price-state value halves",
     qty: 200, price_state: {entry_basis: 100, highest_close_since_entry: 120, stop_in_force: 108}, f: 0.5, p_cum: 240,
     expect: {qty: 400, price_state: {entry_basis: 50.0, highest_close_since_entry: 60.0, stop_in_force: 54.0}, cash_in_lieu: 0.0}}
  - {id: G11b, kind: split_bonus, doc: "1-for-2 bonus on 101 shares: fraction paid at the POST-action price (p_cum x f), not p_cum",
     qty: 101, price_state: {entry_basis: 300}, f: 0.6666666667, p_cum: 300,
     expect: {qty: 151, price_state: {entry_basis: 200.0}, cash_in_lieu: 100.0}}
  - {id: G12, kind: demerger, doc: "demerger: parent unchanged, stub valued at implied value",
     parent_qty: 100, p_cum: 2500, p_discovered: 2200, ratio: 1,
     expect: {f: 0.88, parent_qty: 100, stub_qty: 100, stub_value: 30000.0, stub_implied_per_share: 300.0, cash_in_lieu: 0.0}}
  # r5.4 (review B1): the ratio is resulting shares per parent share. With ratio 1 the r5.3 prose and the
  # reference agreed, which hid the contradiction; these cases do not.
  - {id: G12b, kind: demerger, doc: "1 resulting share for 2 parent shares: half the shares, double the implied price, same total",
     parent_qty: 100, p_cum: 2500, p_discovered: 2200, ratio: 0.5,
     expect: {f: 0.88, parent_qty: 100, stub_qty: 50, stub_value: 30000.0, stub_implied_per_share: 600.0, cash_in_lieu: 0.0}}
  - {id: G12c, kind: demerger, doc: "3 resulting shares per parent share",
     parent_qty: 100, p_cum: 2500, p_discovered: 2200, ratio: 3,
     expect: {f: 0.88, parent_qty: 100, stub_qty: 300, stub_value: 30000.0, stub_implied_per_share: 100.0, cash_in_lieu: 0.0}}
  - {id: G12d, kind: demerger, doc: "fractional entitlement (101 x 0.5 = 50.5): 50 shares plus half a share in cash",
     parent_qty: 101, p_cum: 2500, p_discovered: 2200, ratio: 0.5,
     expect: {f: 0.88, parent_qty: 101, stub_qty: 50, stub_value: 30000.0, stub_implied_per_share: 600.0, cash_in_lieu: 300.0}}
  - {id: G13a, kind: rights, doc: "rights 1:4 at 80, cum 120, pre-2020: intrinsic value", held: 100, a: 1, b: 4, S: 80, p_cum: 120,
     expect: {terp: 112.0, f: 0.933333, entitlements: 25.0, value: 800.0}}
  - {id: G13b, kind: rights, doc: "same, with a listed entitlement closing at 30", held: 100, a: 1, b: 4, S: 80, p_cum: 120, re_listed_close: 30,
     expect: {terp: 112.0, f: 0.933333, entitlements: 25.0, value: 750.0}}
tranches:
  - {id: G14a, doc: "three tranches reach exactly the target; later tranches convert at prior close, not the capped limit",
     target_value: 300000, entry_ref: 1000, weights: [0.3334, 0.3333, 0.3333],
     t2: {revised_target_value: 300000, prior_close: 1020, attempts: [false, true]},
     t3: {revised_target_value: 300000, prior_close: 1000, attempts: [true]},
     expect: {quantities: [100, 97, 103], earmark: 300, cancelled_after: null}}
  - {id: G14b, doc: "tranche 2 exhausts its retries: tranche 3 cancelled, holding kept",
     target_value: 300000, entry_ref: 1000, weights: [0.3334, 0.3333, 0.3333],
     t2: {revised_target_value: 300000, prior_close: 1020, attempts: [false, false, false, false, false, false, false, false, false, false]},
     t3: {revised_target_value: 300000, prior_close: 1000, attempts: [true]},
     expect: {quantities: [100, 0, 0], earmark: 100, cancelled_after: 2}}
  - {id: G14c, doc: "revised target falls: tranches shrink and the final tranche takes only the remainder",
     target_value: 300000, entry_ref: 1000, weights: [0.3334, 0.3333, 0.3333],
     t2: {revised_target_value: 200000, prior_close: 1000, attempts: [true]},
     t3: {revised_target_value: 200000, prior_close: 1000, attempts: [true]},
     expect: {quantities: [100, 66, 34], earmark: 200, cancelled_after: null}}
persist:
  - {id: G15a, values: [true, true, true], n: 3, expect: true}
  - {id: G15b, doc: "one unknown in the window -> unknown, so an exit cannot fire", values: [true, null, true], n: 3, expect: null}
  - {id: G15c, values: [true, false, true], n: 3, expect: false}
  - {id: G15d, doc: "only the last n units count", values: [false, true, true], n: 2, expect: true}
  - {id: G15e, doc: "insufficient history -> unknown", values: [true, true], n: 3, expect: null}
zscores:
  - {id: G16a, doc: "values 1..30: linear-quantile winsorisation, population sd; z of the top value",
     values: "range(1, 31)", direction: higher_better, index: 29, expect: 1.64786, tol: 0.0001}
  - {id: G16b, doc: "lower_better flips the sign", values: "range(1, 31)", direction: lower_better, index: 29, expect: -1.64786, tol: 0.0001}
  - {id: G16c, doc: "value 16", values: "range(1, 31)", direction: higher_better, index: 15, expect: 0.05798, tol: 0.0001}
  - {id: G16d, doc: "29 contributors -> missing for all", values: "range(1, 30)", direction: higher_better, index: 0, expect: null}
  - {id: G16e, doc: "zero standard deviation -> missing for all", values: "[5.0] * 30", direction: higher_better, index: 0, expect: null}
features:
  - {id: G17a, kind: roce, doc: "leases inside capital employed", args: {ebit: 210, equity: 1000, borrowings: 200, leases: 100, cash: 250, total_assets: 2000, prior_ce: 950},
     expect: {state: known, value: 0.21, cash_rich_capped: false}}
  - {id: G17b, kind: roce, doc: "cash-rich, asset-light: capped at 1.00 and passes rather than failing", args: {ebit: 200, equity: 500, borrowings: 0, leases: 0, cash: 480, total_assets: 1000, prior_ce: 25},
     expect: {state: known, value: 1.0, cash_rich_capped: true}}
  - {id: G17c, kind: roce, doc: "negative equity fails", args: {ebit: 50, equity: -10, borrowings: 300, leases: 0, cash: 20, total_assets: 400, prior_ce: 270},
     expect: {state: out_of_domain, outcome: fail}}
  - {id: G17d, kind: cfo_pat, doc: "negative over negative is NOT 1.5 - it is out of domain", args: {sum_cfo: -150, sum_pat: -100},
     expect: {state: out_of_domain, outcome: fail}}
  - {id: G17e, kind: cfo_pat, args: {sum_cfo: 140, sum_pat: 200}, expect: {state: known, value: 0.7}}
ranking:
  - {id: G18a, doc: "scores within 1e-9 tie; higher market cap first", rows: [{isin: A, score: 0.5000000001, market_cap: 100}, {isin: B, score: 0.5, market_cap: 200}, {isin: C, score: 0.49, market_cap: 300}],
     expect: [B, A, C]}
  - {id: G18b, doc: "full tie falls to ISIN", rows: [{isin: Y, score: 0.6, market_cap: 10}, {isin: X, score: 0.6, market_cap: 10}], expect: [X, Y]}
pit:
  rows:
    - {isin: INE0TEST, basis: consolidated, usable_from: "2026-09-17T18:00", value: 1}
    - {isin: INE0TEST, basis: standalone,   usable_from: "2026-09-18T18:30", value: 2}
    - {isin: INE0TEST, basis: consolidated, usable_from: "2026-09-18T20:30", value: 3}
  cases:
    - {id: G19a, doc: "basis filter BEFORE choosing the latest row: the newer standalone row must not hide the consolidated one",
       basis: consolidated, cutoff: "2026-09-18T20:00", expect_value: 1}
    - {id: G19b, doc: "a filing usable at 20:30 is invisible to the 20:00 run", basis: consolidated, cutoff: "2026-09-18T20:00", expect_value: 1}
    - {id: G19c, doc: "and visible to the next day's run", basis: consolidated, cutoff: "2026-09-19T20:00", expect_value: 3}
    - {id: G19d, doc: "a filing usable at 18:30 on D is used on D (cutoff 20:00, never midnight)", basis: standalone, cutoff: "2026-09-18T20:00", expect_value: 2}
  canary: {id: G20, doc: "reading a row after its cutoff raises a hard error", row_index: 2, cutoff: "2026-09-18T20:00"}
blackout:
  - {id: G21a, doc: "three post-demerger quarters filed: still in valuation blackout", quarters: 3, expect: true}
  - {id: G21b, quarters: 4, expect: false}

# ---------------- r5.2 additions ----------------
cutoffs:
  rows:
    - {isin: INE0TEST, domain: disclosure,   usable_from: "2026-09-18T21:00", value: 10}
    - {isin: INE0TEST, domain: exchange_eod, usable_from: "2026-09-18T22:30", value: 20}
    - {isin: INE0TEST, domain: disclosure,   usable_from: "2026-09-18T18:30", value: 30}
  cutoffs: {disclosure: "2026-09-18T20:00", exchange_eod: "2026-09-18T23:00"}
  cases:
    - {id: G22a, doc: "the 22:30 bhavcopy IS used by the 23:00 run", domain: exchange_eod, expect_value: 20}
    - {id: G22b, doc: "the 21:00 filing is NOT used by the same run - one scalar cutoff cannot do both", domain: disclosure, expect_value: 30}
basis_fallback:
  - {id: G23a, doc: "a company that files consolidated: standalone never substitutes", files_consolidated: true, expect_value: 1}
  - {id: G23b, doc: "a company that files no consolidated statements: standalone is used", files_consolidated: false, expect_value: 2}
bounded_qty:
  - {id: G24a, doc: "quantity from the reference price, capped so the worst allowed fill cannot breach the hard cap",
     target_value: 100000, reference_price: 100, hard_cap_value: 100000, limit_price: 103, expect: 970, worst_case_value: 99910}
  - {id: G24b, doc: "when the cap does not bind, the target size stands", target_value: 50000, reference_price: 100, hard_cap_value: 100000, limit_price: 103, expect: 500, worst_case_value: 51500}
allocator:
  - {id: G25a, doc: "two strategies agreeing on one security do NOT double the exposure",
     claims: [{target_value: 50000}, {target_value: 50000}], expect: 50000}
  - {id: G25b, doc: "the larger claim sets the security target", claims: [{target_value: 50000}, {target_value: 80000}], expect: 80000}
  - {id: G25c, doc: "when a claim closes, the target falls to what the remaining claims support",
     claims: [{target_value: 80000, state: closed}, {target_value: 50000}], expect: 50000}
slots:
  - {id: G26, doc: "existing holding first, then earliest signal, then larger market cap",
     max_open_positions: 2, existing: [INE0C],
     candidates: [{isin: INE0A, signal_ts: "2026-09-18T20:00", market_cap: 500},
                  {isin: INE0B, signal_ts: "2026-09-17T20:00", market_cap: 100},
                  {isin: INE0C, signal_ts: "2026-09-19T20:00", market_cap: 50}],
     expect: {actionable: [INE0C, INE0B], valid_but_not_currently_actionable: [INE0A]}}
dividends:
  - {id: G27a, doc: "accrued on the ex-date but not spendable", amount: 5000, ex_date: 2026-08-10, pay_date: 2026-09-05, as_of: 2026-08-20, expect: {accrued: 5000.0, spendable: 0.0}}
  - {id: G27b, doc: "spendable from the payment date", amount: 5000, ex_date: 2026-08-10, pay_date: 2026-09-05, as_of: 2026-09-05, expect: {accrued: 5000.0, spendable: 5000.0}}
tax_multi:
  - {id: G28a, doc: "a short-term loss carries forward and sets off a later long-term gain",
     years: [{fy: 2025, disposals: [{buy_date: 2025-05-01, sell_date: 2025-09-01, qty: 500, cost_per_share: 200, sale_per_share: 100}]},
             {fy: 2026, disposals: [{buy_date: 2024-01-01, sell_date: 2026-09-01, qty: 1000, cost_per_share: 100, sale_per_share: 300}]}],
     expect_last: {fy: 2026, stcg: 0.0, ltcg: 150000.0, carried_st_loss: 0.0, carried_lt_loss: 0.0, tax_before_cess: 3125.0, tax_with_cess: 3250.0}}
  - {id: G28b, doc: "the FY 2024-25 straddle: each sale taxed at the regime in force on its own date",
     years: [{fy: 2024, disposals: [{buy_date: 2024-02-01, sell_date: 2024-06-01, qty: 100, cost_per_share: 100, sale_per_share: 200},
                                    {buy_date: 2024-05-01, sell_date: 2024-09-01, qty: 100, cost_per_share: 100, sale_per_share: 200}]}],
     expect_last: {fy: 2024, stcg: 20000.0, ltcg: 0.0, carried_st_loss: 0.0, carried_lt_loss: 0.0, tax_before_cess: 3500.0, tax_with_cess: 3640.0}}
  # r5.4 (review H7): losses lapse after eight years; a short-term loss stays short-term when carried
  - {id: G28c, doc: "a long-term loss from FY 2019-20 has lapsed by FY 2028-29 (usable FY 2020-21 to 2027-28)",
     years: [{fy: 2019, disposals: [{buy_date: 2018-04-02, sell_date: 2019-06-03, qty: 1000, cost_per_share: 300, sale_per_share: 200}]},
             {fy: 2028, disposals: [{buy_date: 2026-01-01, sell_date: 2028-06-01, qty: 1000, cost_per_share: 100, sale_per_share: 400}]}],
     expect_last: {fy: 2028, stcg: 0.0, ltcg: 300000.0, carried_st_loss: 0.0, carried_lt_loss: 0.0, tax_before_cess: 21875.0, tax_with_cess: 22750.0}}
  - {id: G28d, doc: "the same loss in its eighth year is still usable",
     years: [{fy: 2019, disposals: [{buy_date: 2018-04-02, sell_date: 2019-06-03, qty: 1000, cost_per_share: 300, sale_per_share: 200}]},
             {fy: 2027, disposals: [{buy_date: 2025-01-01, sell_date: 2027-06-01, qty: 1000, cost_per_share: 100, sale_per_share: 400}]}],
     expect_last: {fy: 2027, stcg: 0.0, ltcg: 200000.0, carried_st_loss: 0.0, carried_lt_loss: 0.0, tax_before_cess: 9375.0, tax_with_cess: 9750.0}}
  - {id: G28e, doc: "a carried short-term loss sets off a later SHORT-term gain (r5.3 re-labelled it long-term and could not)",
     years: [{fy: 2025, disposals: [{buy_date: 2025-05-01, sell_date: 2025-09-01, qty: 500, cost_per_share: 200, sale_per_share: 100}]},
             {fy: 2026, disposals: [{buy_date: 2026-05-01, sell_date: 2026-08-03, qty: 1000, cost_per_share: 100, sale_per_share: 180}]}],
     expect_last: {fy: 2026, stcg: 30000.0, ltcg: 0.0, carried_st_loss: 0.0, carried_lt_loss: 0.0, tax_before_cess: 6000.0, tax_with_cess: 6240.0}}
metrics:
  - {id: G29a, kind: alpha, series: [0.01, 0.02, -0.005, 0.015], expect: 0.12, tol: 0.000001}
  - {id: G29b, kind: sharpe, series: [0.01, 0.02, -0.005, 0.015], expect: 3.2072, tol: 0.0001}
  - {id: G29c, kind: newey_west, series: [0.01, 0.02, -0.005, 0.015], lag: 1, expect: 0.0027951, tol: 0.0000001}
  - {id: G29d, kind: turnover, total_traded_value: 200000, average_portfolio_value: 500000, years: 2, expect: 0.1, tol: 0.000001}
sensitivity:
  - {id: G30a, doc: "broad stable region passes", center: 0.10, neighbours: [0.09, 0.08], expect: true}
  - {id: G30b, doc: "isolated spike at the chosen value fails", center: 0.10, neighbours: [0.02, 0.01], expect: false}
  - {id: G30c, doc: "sign flip beside the chosen value fails", center: 0.10, neighbours: [0.09, -0.01], expect: false}
  - {id: G30d, doc: "a pre-registered value need NOT be the peak", center: 0.10, neighbours: [0.13, 0.12], expect: true}

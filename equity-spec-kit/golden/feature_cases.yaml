ey_median:
  - {id: F25, doc: "1300 sessions: 50 x 0.01, 625 x 0.03, 625 x 0.05. Only the last 1250 count (625/625): median 0.04. All history would give 0.03; a 1251-session window 0.03",
     blocks: [[50, 0.01], [625, 0.03], [625, 0.05]], transformative_index: null, expect: {state: known, value: 0.04}}
  - {id: F26, doc: "800 known values, the latest transformative ex-date at index 100 -> 699 remain, below 750 -> out of domain (drop)",
     blocks: [[400, 0.04], [400, 0.06]], transformative_index: 100, expect: {state: out_of_domain, outcome: drop}}
  - {id: F26b, doc: "800 values, transformative ex-date at index 50: indices 0..50 excluded ('on or before') -> 749 < 750 -> drop", blocks: [[400, 0.04], [400, 0.06]], transformative_index: 50, expect: {state: out_of_domain, outcome: drop}}
  - {id: F26c, doc: "same at index 49: exactly 750 remain (350 x 0.04, 400 x 0.06) -> known, middle pair 375/376 -> 0.06", blocks: [[400, 0.04], [400, 0.06]], transformative_index: 49, expect: {state: known, value: 0.06}}
  - {id: F26d, doc: "the index is into the full history: 1300 sessions, ex-date at index 549 -> window positions 0..499 excluded, 750 remain -> known", blocks: [[1300, 0.05]], transformative_index: 549, expect: {state: known, value: 0.05}}
  - {id: F27, doc: "800 values, 400 x 0.04 then 400 x 0.06: even count -> mean of the middle pair = 0.05",
     blocks: [[400, 0.04], [400, 0.06]], transformative_index: null, expect: {state: known, value: 0.05}}


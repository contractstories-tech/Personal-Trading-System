# Feature golden cases - registry 3.0.0 features, forensic flags and window_conventions (audit B8).
# Answers are computed by hand (the arithmetic is in each doc). Any M6 feature build must reproduce every one.
#
# Series specs (price features): n sessions, oldest first, t = the last. Field specs:
#   {const: v} | {linear: [start, step]} | {alt: [a, b]} | {offset: d} (adj_close + d) - plus set: {index: value}.
#   absent: [indices] marks sessions where the security is absent (window_conventions.present).

